<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-Up Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="wrapper">
        <div id="left-column">
            <div class="logo"><img src="img/odin-lined.png" alt="odin logo">ODIN</div>
            <div class="photo-credit">Photo by <a
                    href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA"
                    target="_blank" rel="nofollow">Halie West</a></div>
        </div>
        <div id="right-column">
            <div id="message">
                <p>This is not a real online service! You know you need something like this in your life to help you
                    realize
                    your deepest dreams. <br>Sign up <em>now</em> to get started.<br><br>You know you want to.</p>
            </div>
            <div id="form">
                <h2>Let's do this!</h2>
                <form action="" method="post" id="form1">
                    <div class="inputs">
                        <div class="input-col">
                            <label for="first-name" class="form-label">First
                                Name:</label>
                            <input name="first-name" type="text" class="form-input" id="first-name">
                            <label for="email" class="form-label">Email:</label>
                            <input name="email" type="email" class="form-input">
                            <label for="password1" class="form-label">Password:</label>
                            <input name="password1" type="password">
                        </div>
                        <div class="input-col">
                            <label for="last-name" class="form-label">Last
                                Name:</label>
                            <input name="last-name" class="form-input">
                            <label for="phone" class="form-label">Phone Number:</label>
                            <input name="phone" type="tel" class="form-input" min="10" max="10"
                                placeholder="555-123-4567">
                            <label for="password2" class="form-label">Re-Enter Password:</label>
                            <input name="password2" type="password"
                                pattern="^(?=.*?[a-z])(?=.*?[0-9])(?=.*?[#?!@$%^&*-]).{7,}$"
                                title="Minimum of 7 characters. Should have at least one special character and one number and one UpperCase Letter.">
                        </div>
                    </div>
                    <br>
                </form>
            </div>
            <div id="submit"><button type="submit" form="form1" value="submit">Create Account</button>
                <p>Already have an account? <a href="#">Log in.</a></p>
            </div>
        </div>
    </div>
</body>

</html>
